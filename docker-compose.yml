services:
  # -------------------------------------------------------------
  # Container 1: Halal-Invest Web Application (Node + React + Express)
  # -------------------------------------------------------------
  app:
    container_name: halal-invest-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://halal_user:halal_password@postgres:5432/halal_invest
      # FYERS Broker Credentials (Loaded from .env or defaults to Sandbox Simulator)
      - FYERS_APP_ID=${FYERS_APP_ID:-}
      - FYERS_SECRET_KEY=${FYERS_SECRET_KEY:-}
      - FYERS_REDIRECT_URI=${FYERS_REDIRECT_URI:-http://localhost:3000/api/fyers/callback}
      - FYERS_ACCESS_TOKEN=${FYERS_ACCESS_TOKEN:-}
      - FYERS_SANDBOX=${FYERS_SANDBOX:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # -------------------------------------------------------------
  # Container 2: PostgreSQL Relational Database (Persistent Storage)
  # -------------------------------------------------------------
  postgres:
    container_name: halal-invest-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: halal_user
      POSTGRES_PASSWORD: halal_password
      POSTGRES_DB: halal_invest
    volumes:
      # Persistent named Docker volume: data survives all container restarts & rebuilds
      - postgres_data:/var/lib/postgresql/data
      # Automatically initialize database schema on first volume creation
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halal_user -d halal_invest"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  # Persistent volume for PostgreSQL database
  postgres_data:
    name: halal_invest_postgres_data
